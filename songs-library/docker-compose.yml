# Local Songs Library — SQLite on disk (no Neon).
# From this folder:
#   docker compose up -d --build
#   docker compose down

services:
  songs-library:
    container_name: songs-library
    build:
      context: .
      dockerfile: Dockerfile
    image: songs-library:local
    ports:
      - "8100:8100"
    volumes:
      # Persist catalog across stop/start
      - ./data:/app/data
    environment:
      PORT: "8100"
      DATABASE_URL: sqlite:////app/data/library.db
      # Optional: set in a .env file next to this compose file
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      YOUTUBE_PLAYWRIGHT_FALLBACK: ${YOUTUBE_PLAYWRIGHT_FALLBACK:-true}
      YOUTUBE_PLAYWRIGHT_HEADLESS: ${YOUTUBE_PLAYWRIGHT_HEADLESS:-true}
      BACKGROUND_WORKERS_ENABLED: ${BACKGROUND_WORKERS_ENABLED:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      # Semantic enrich / NL search (OpenAI-compatible; Ollama example below)
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-llama3.2}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      SEMANTIC_ENRICH_ENABLED: ${SEMANTIC_ENRICH_ENABLED:-true}
    restart: unless-stopped
    # Uncomment so the container can reach Ollama on the Windows/Mac host:
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
