<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Composers — Songs Library</title>
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
  <header class="top">
    <div>
      <p class="eyebrow">Standalone catalog</p>
      <h1>Composers</h1>
      <p class="sub">Movies/albums and song counts by composer in the library.</p>
    </div>
    <nav class="site-nav" aria-label="Library">
      <a href="/">Home</a>
      <a href="/composers" aria-current="page">Composers</a>
    </nav>
  </header>

  <section class="controls composers-controls">
    <input
      id="composer-filter"
      type="search"
      inputmode="search"
      placeholder="Filter composers…"
      autocomplete="off"
    />
    <p id="composer-summary" class="meta composers-summary">Loading…</p>
  </section>

  <p id="status" class="status"></p>

  <div id="composers-list" class="composers-list">
    <p class="meta">Loading composers…</p>
  </div>

  <script src="/assets/composers.js"></script>
</body>
</html>
