<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Songs Library</title>
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
  <header class="top">
    <div>
      <p class="eyebrow">Standalone catalog</p>
      <h1>Songs Library</h1>
      <p class="sub">Film songs for NoRepeat — browse without the player app.</p>
    </div>
    <button id="browse" type="button" class="browse-btn" title="Browse discovered songs">
      <span class="browse-label">Browse library</span>
      <strong id="browse-count">0</strong>
      <span class="browse-sub">songs discovered</span>
    </button>
  </header>

  <section class="controls">
    <input
      id="seed"
      type="search"
      inputmode="search"
      enterkeyhint="go"
      placeholder="Enter a seed — e.g. Ilaiyaraaja, A. R. Rahman…"
      autocomplete="off"
    />
    <button id="discover" type="button" class="accent">Discover</button>
  </section>

  <section id="year-range" class="year-range">
    <div class="year-range-fields">
      <label>
        <span>From year</span>
        <input
          id="year-from"
          type="text"
          inputmode="numeric"
          autocomplete="off"
          placeholder="e.g. 1980"
        />
      </label>
      <label>
        <span>To year</span>
        <input
          id="year-to"
          type="text"
          inputmode="numeric"
          autocomplete="off"
          placeholder="e.g. 1990"
        />
      </label>
    </div>
    <p id="year-error" class="year-error" hidden></p>
    <p class="year-hint">Same as the player discovery year range. Leave blank for any year (1950–2100).</p>
  </section>

  <p id="status" class="status"></p>
  <div id="list" class="list" hidden></div>
  <script src="/assets/app.js"></script>
</body>
</html>
